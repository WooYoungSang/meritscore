<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ce8ff"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
    <radialGradient id="wcore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#e8fbff" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#5ce8ff" stop-opacity="0.85"/>
      <stop offset="70%"  stop-color="#00a8cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00a8cc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer halo -->
  <circle cx="32" cy="32" r="30" fill="url(#wcore)" opacity="0.3"/>
  <!-- outer reactor ring -->
  <circle cx="32" cy="32" r="30" fill="#0b1218" stroke="url(#wg)" stroke-width="1.8"/>
  <!-- mid ring -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#wg)" stroke-width="0.4" opacity="0.4"/>
  <!-- inner ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#wg)" stroke-width="0.7" opacity="0.55"/>
  <!-- 4 reactor slots: 12, 4, 6, 8 o'clock -->
  <g stroke="url(#wg)" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="2.5" x2="32" y2="7"/>
    <line x1="57.98" y1="47" x2="55.38" y2="45.5"/>
    <line x1="6.02" y1="47" x2="8.62" y2="45.5"/>
    <line x1="32" y1="61.5" x2="32" y2="57"/>
  </g>
  <!-- core glow -->
  <circle cx="32" cy="32" r="19" fill="url(#wcore)" opacity="0.6"/>
  <circle cx="32" cy="32" r="11" fill="url(#wcore)" opacity="0.55"/>
  <!-- prominent inverted triangle inscribed in inner ring (r=27) -->
  <path d="M8.62 18.5 L55.38 18.5 L32 59 Z" fill="#0b1218" stroke="url(#wg)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- inner triangle echo -->
  <path d="M13 21 L51 21 L32 53.8 Z" fill="none" stroke="url(#wg)" stroke-width="0.7" stroke-linejoin="round" opacity="0.5"/>
  <!-- vertex node caps -->
  <g fill="#0b1218" stroke="url(#wg)" stroke-width="0.9">
    <circle cx="8.62" cy="18.5" r="1.6"/>
    <circle cx="55.38" cy="18.5" r="1.6"/>
    <circle cx="32" cy="59" r="1.6"/>
  </g>
  <g fill="#5ce8ff" opacity="0.85">
    <circle cx="8.62" cy="18.5" r="0.7"/>
    <circle cx="55.38" cy="18.5" r="0.7"/>
    <circle cx="32" cy="59" r="0.7"/>
  </g>
  <!-- spark dot above W -->
  <circle cx="32" cy="24" r="2.5" fill="#5ce8ff" opacity="0.4"/>
  <circle cx="32" cy="24" r="1.2" fill="#ffffff"/>
  <!-- W: center vertex at (32,32), outer strokes at ±60° -->
  <path d="M21.96 30.5 L26 37.5 L32 32 L38 37.5 L42.04 30.5"
        fill="none" stroke="#e8fbff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"
        filter="drop-shadow(0 0 1.4px #5ce8ff)"/>
</svg>
